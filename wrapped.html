<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Wrapped da Banda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="wrapped.css" />
</head>

<body>

  <div class="rotate-warning" aria-hidden="true">
    <div>
      🔄<br><br>
      O Wrapped agora foi adaptado para mobile.
    </div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="wrapped-heading">
        <span class="app-kicker">Wrapped administrativo</span>
        <div class="app-title">Banda Wrapped</div>
        <div class="app-subtitle">
          Histórico da banda, preferências, participações e títulos internos.
        </div>
      </div>
      <div class="filters">
        <div class="filter-group">
          <label for="startDate">De:</label>
          <input type="date" id="startDate" />
        </div>
        <div class="filter-group">
          <label for="endDate">Até:</label>
          <input type="date" id="endDate" />
        </div>
        <div class="filter-group">
          <label for="memberFilter">Integrante:</label>
          <select id="memberFilter"></select>
        </div>
      </div>
      <div class="view-toggle">
        <button class="view-tab active" data-view="band">
          <span class="icon">📊</span>
          <span>Visão da banda</span>
        </button>
        <button class="view-tab" data-view="member">
          <span class="icon">👤</span>
          <span>Perfil do integrante</span>
        </button>
        <button class="view-tab" data-view="titles">
          <span class="icon">🏆</span>
          <span>Títulos</span>
        </button>
      </div>
    </header>

    <main class="sections">
      <div class="views-wrapper">
        <div class="views-inner">


          <section class="view-panel active" data-view="band">
            <div id="bandSection"></div>
          </section>

          <section class="view-panel" data-view="member">
            <div id="memberSection"></div>
          </section>

          <section class="view-panel" data-view="titles">
            <div class="section-title">
              <span class="icon">🏆</span>
              Galeria de Títulos
            </div>
            <div class="section-subtitle">
              Conquistas, estatísticas duvidosas e glórias eternas da banda.
            </div>

            <div id="titlesGrid" class="titles-grid"></div>
          </section>


        </div>
      </div>
    </main>
  </div>

  <script src="wrapped.js"></script>
</body>

</html>
