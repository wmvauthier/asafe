<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Projeto Asafe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegacao principal">
      <div class="brand-block">
        <div class="brand-mark">A</div>
        <div>
          <p class="brand-kicker">Projeto Asafe</p>
          <h1>Music Admin</h1>
        </div>
      </div>

      <nav class="side-nav">
        <button class="nav-item active" data-view="hoje">
          <span>📅</span>
          <span>Hoje</span>
        </button>
        <button class="nav-item" data-view="cultos">
          <span>📆</span>
          <span>Cultos</span>
        </button>
        <button class="nav-item" data-view="repertorio">
          <span>🎵</span>
          <span>Repertorio</span>
        </button>
        <button class="nav-item" data-view="wrapped">
          <span>🏆</span>
          <span>Wrapped</span>
        </button>
        <button class="nav-item" data-view="titulos">
          <span>🎖️</span>
          <span>Títulos</span>
        </button>
      </nav>
    </aside>

    <main class="main-stage">
      <header class="topbar">
        <div>
          <p id="viewKicker" class="page-kicker">Agora na fila</p>
          <h2 id="viewTitle">Hoje</h2>
        </div>
        <div class="topbar-actions">
          <button id="quickBuilderBtn" class="pill-button" type="button">Montar repertorio</button>
        </div>
      </header>

      <section id="view-hoje" class="view active" aria-labelledby="viewTitle"></section>
      <section id="view-cultos" class="view" aria-labelledby="viewTitle"></section>
      <section id="view-repertorio" class="view" aria-labelledby="viewTitle"></section>
      <section id="view-wrapped" class="view" aria-labelledby="viewTitle"></section>
      <section id="view-titulos" class="view" aria-labelledby="viewTitle"></section>
    </main>

    <nav class="mobile-nav" aria-label="Navegacao mobile">
      <button class="nav-item active" data-view="hoje">
        <span>📅</span>
        <span>Hoje</span>
      </button>
      <button class="nav-item" data-view="cultos">
        <span>📆</span>
        <span>Cultos</span>
      </button>
      <button class="nav-item" data-view="repertorio">
        <span>🎵</span>
        <span>Repertorio</span>
      </button>
      <button class="nav-item" data-view="wrapped">
        <span>🏆</span>
        <span>Wrapped</span>
      </button>
      <button class="nav-item" data-view="titulos">
        <span>🎖️</span>
        <span>Títulos</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>

</html>
